<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O'quv markaz</title>
<script>function CN(){try{return localStorage.getItem('centerName')||'O\u02bbquv markaz'}catch(e){return 'O\u02bbquv markaz'}}</script>
<style>
  :root{--bg:#0e1424;--card:#172038;--line:#26335a;--text:#e8edf8;--mut:#8f9bbd;--acc:#3ddc97;--blue:#4da3ff;--bad:#ff6b6b;--warn:#ffc857}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:16px 16px 110px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  header h1{font-size:22px;margin:0}
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  nav button{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
  nav button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  button{font-family:inherit}
  .btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
  .btn.sec{background:var(--line)}
  .btn.red{background:transparent;color:var(--bad);border:1px solid var(--bad);padding:5px 10px;font-size:12px}
  .btn.small{padding:5px 10px;font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat .n{font-size:32px;font-weight:700}
  .stat .l{color:var(--mut);font-size:13px}
  input,select,textarea{background:#0a0f1c;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font-size:15px;font-family:inherit;width:100%}
  input[type=checkbox]{width:auto}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:13px}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px}
  .pill.g{background:rgba(61,220,151,.15);color:var(--acc)}
  .pill.r{background:rgba(255,107,107,.15);color:var(--bad)}
  .pill.y{background:rgba(255,200,87,.15);color:var(--warn)}
  .bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar>div{height:100%;background:var(--acc)}
  .att{display:flex;gap:6px;justify-content:flex-end}
  .att button{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;padding:7px 12px;cursor:pointer}
  .att button.p.sel{background:var(--acc);color:#05261a;border-color:var(--acc)}
  .att button.a.sel{background:var(--bad);color:#fff;border-color:var(--bad)}
  .empty{color:var(--mut);text-align:center;padding:22px;line-height:1.6}
  .task-students{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;margin-top:10px}
  .task-students label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .mut{color:var(--mut);font-size:13px}
  .list-item{padding:10px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:0}
  .form{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

  /* + tugmasi */
  #fab{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  #fabBtn{width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:#05261a;font-size:34px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .2s}
  #fab.open #fabBtn{transform:rotate(45deg);background:var(--bad);color:#fff}
  #fabMenu{display:none;flex-direction:column;gap:8px;align-items:flex-end}
  #fab.open #fabMenu{display:flex}
  #fabMenu button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:30px;padding:12px 18px;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.35);white-space:nowrap}
  #fabMenu button:hover{border-color:var(--acc)}
  #shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
  #fab.open ~ #shade{display:block}

  .btn:disabled{opacity:.4;cursor:not-allowed}
  .bub{background:#0a0f1c;border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px;margin-bottom:12px;line-height:1.55}
  .ansrow{display:flex;gap:8px;flex-wrap:wrap}
  .ansrow button{flex:1;min-width:100px;padding:15px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;cursor:pointer}
  .ansrow button:hover{border-color:var(--acc)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--line);color:var(--mut)}
  .chip.ok{background:rgba(61,220,151,.15);color:var(--acc)}
  .chip.no{background:rgba(255,107,107,.15);color:var(--bad)}
  pre.code{background:#0a0f1c;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font:13px/1.55 Consolas,monospace;white-space:pre;margin:10px 0}
  .hwbox{background:rgba(255,200,87,.08);border:1px solid rgba(255,200,87,.35);border-radius:12px;padding:12px;margin-top:6px;line-height:1.5}
  .lesson-p{line-height:1.6;margin:6px 0 14px}

  .card{overflow-x:auto}
  .grid.stats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  #fabMenu{max-height:68vh;overflow-y:auto}
  .jt{border-collapse:separate;border-spacing:0;font-size:14px}
  .jt th,.jt td{text-align:center;padding:8px 6px;min-width:40px;border-bottom:1px solid var(--line)}
  .jt th:first-child,.jt td:first-child{position:sticky;left:0;background:var(--card);text-align:left;min-width:110px;z-index:1}
  .gc{display:inline-block;width:28px;height:28px;line-height:28px;border-radius:8px;font-weight:700}
  .g5{background:rgba(61,220,151,.18);color:var(--acc)}
  .g4{background:rgba(77,163,255,.18);color:var(--blue)}
  .g3{background:rgba(255,200,87,.18);color:var(--warn)}
  .g2{background:rgba(255,107,107,.18);color:var(--bad)}
  .gn{color:var(--bad)}
  .att button.gb{padding:7px 11px}
  .att button.gb.g5.sel{background:var(--acc);color:#05261a;border-color:var(--acc)}
  .att button.gb.g4.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
  .att button.gb.g3.sel{background:var(--warn);color:#2a1d00;border-color:var(--warn)}
  .att button.gb.g2.sel{background:var(--bad);color:#fff;border-color:var(--bad)}

  a.btn{text-decoration:none;display:inline-block}

  /* oyna */
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:16px}
  #modal.show{display:flex}
  .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
  .box h3{margin:0 0 14px;font-size:18px}
  .box .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#0a0f1c;border:1px solid var(--acc);color:var(--text);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header><span style="font-size:28px">🤖</span><h1 id="cn" onclick="__askName()" style="cursor:pointer"></h1></header>
  <nav id="nav"></nav>
  <div id="view"></div>
</div>

<div id="fab">
  <div id="fabMenu">
    <button onclick="fabGo('student')">👤 O'quvchi qo'shish</button>
    <button onclick="fabGo('lesson')">📚 Dars qo'shish</button>
    <button onclick="fabGo('pay')">💰 Oylik to'lov belgilash</button>
    <button onclick="fabGo('grade')">⭐ Baho qo'yish</button>
    <button onclick="fabGo('sched')">🗓 Jadvalga dars qo'shish</button>
    <button onclick="fabGo('ai')">🤖 AI so'rovi (keldi / vazifa)</button>
    <button onclick="fabGo('attendance')">✅ Davomat belgilash</button>
    <button onclick="fabGo('task')">📝 Topshiriq qo'shish</button>
  </div>
  <button id="fabBtn" onclick="toggleFab()" aria-label="Qo'shish">+</button>
</div>
<div id="shade" onclick="toggleFab(false)"></div>

<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script>
const KEY = 'robotics_club_v1';
let db = load();
let tab = 'home';

function today(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.students) return d; }catch(e){}
  return { students: [], lessons: [], attendance: {}, tasks: [] };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function fmtDate(d){ if(!d) return ''; const p = d.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }

let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), Math.max(2200, String(msg).length * 55));
}

// ---------- + tugmasi
function toggleFab(force){
  const f = $('fab');
  const open = force === undefined ? !f.classList.contains('open') : force;
  f.classList.toggle('open', open);
}
function fabGo(what){
  toggleFab(false);
  if (what === 'pay') openPayModal();
  if (what === 'grade') openGrade();
  if (what === 'sched') openSchedModal();
  if (what === 'ai') openFlow();
  if (what === 'student') openStudentModal();
  if (what === 'lesson') openLessonModal();
  if (what === 'attendance') openAttendance();
  if (what === 'task') openTaskModal();
}

// ---------- oyna
let modalOk = null;
function openModal(title, html, okText, onOk){
  modalOk = onOk;
  $('box').innerHTML = '<h3>' + esc(title) + '</h3>' + html +
    '<div class="actions"><button class="btn sec" onclick="closeModal()">Bekor qilish</button>' +
    '<button class="btn" onclick="modalSubmit()">' + esc(okText) + '</button></div>';
  $('modal').classList.add('show');
  const first = $('box').querySelector('input[type=text]');
  if (first) setTimeout(() => first.focus(), 50);
}
function closeModal(){ $('modal').classList.remove('show'); modalOk = null; }
function modalSubmit(){ if (modalOk && modalOk() !== false) closeModal(); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeModal(); toggleFab(false); } });
function askConfirm(text, onYes){
  openModal('Tasdiqlang', '<p style="margin:0;line-height:1.5">' + esc(text) + '</p>', 'Ha', () => { onYes(); });
}

// ---------- statistika
function attendancePct(sid){
  const days = Object.keys(db.attendance).filter(d => sid in db.attendance[d]);
  if (!days.length) return null;
  const p = days.filter(d => db.attendance[d][sid]).length;
  return Math.round(p * 100 / days.length);
}
function avgAttendance(){
  const vals = db.students.map(s => attendancePct(s.id)).filter(v => v !== null);
  return vals.length ? Math.round(vals.reduce((a,b) => a + b, 0) / vals.length) : null;
}
function taskProgress(t){
  if (!db.students.length) return 0;
  const done = db.students.filter(s => t.done[s.id]).length;
  return Math.round(done * 100 / db.students.length);
}
function studentTaskCount(sid){ return db.tasks.filter(t => t.done[sid]).length; }

// ---------- navigatsiya
const TABS = [
  ['home','🏠 Bosh sahifa'], ['students',"👥 O'quvchilar"], ['journal','📒 Jurnal'], ['attendance','✅ Davomat'], ['schedule','🗓 Jadval'], ['pay',"💰 To'lovlar"], ['msg','📨 Ota-onalar'],
  ['lessons','📚 Darslar'], ['tasks','📝 Topshiriqlar'], ['ai','🤖 AI yordamchi'], ['backup','💾 Zaxira']
];
function renderNav(){
  $('nav').innerHTML = TABS.map(t => '<button class="' + (t[0] === tab ? 'active' : '') + '" onclick="go(\'' + t[0] + '\')">' + t[1] + '</button>').join('');
}
function go(t){ tab = t; render(); }
function render(){
  renderNav();
  const views = {home:viewHome, students:viewStudents, attendance:viewAttendance, lessons:viewLessons, tasks:viewTasks, ai:viewAI, journal:viewJournal, schedule:viewSchedule, pay:viewPay, msg:viewMsg, backup:viewBackup};
  $('view').innerHTML = views[tab]();
}
const HINT = '<div class="empty">Hali hech narsa yo\'q.<br>O\'ng pastdagi <b style="color:var(--acc)">+</b> tugmasini bosing.</div>';

// ---------- bosh sahifa
function viewHome(){
  const avg = avgAttendance();
  const t = today();
  const upLessons = db.lessons.filter(l => l.date >= t).sort((a,b) => a.date.localeCompare(b.date)).slice(0,4);
  const upTasks = db.tasks.filter(x => x.deadline && x.deadline >= t && taskProgress(x) < 100).sort((a,b) => a.deadline.localeCompare(b.deadline)).slice(0,4);
  const rank = db.students.map(s => ({n:s.name, c:studentTaskCount(s.id), a:attendancePct(s.id)}))
    .sort((a,b) => b.c - a.c || (b.a||0) - (a.a||0)).slice(0,5);
  return '<div class="grid stats" style="margin-bottom:14px">' +
    '<div class="stat"><div class="n">' + db.students.length + '</div><div class="l">O\'quvchilar</div></div>' +
    '<div class="stat"><div class="n">' + db.lessons.length + '</div><div class="l">Darslar</div></div>' +
    '<div class="stat"><div class="n">' + (avg === null ? '—' : avg + '%') + '</div><div class="l">O\'rtacha davomat</div></div>' +
    '<div class="stat"><div class="n">' + db.tasks.filter(x => taskProgress(x) < 100).length + '</div><div class="l">Ochiq topshiriqlar</div></div>' +
    '<div class="stat"><div class="n">' + monthPaidCount(thisMonth()) + ' / ' + db.students.length + '</div><div class="l">Bu oy to\'lagan</div></div>' +
    '<div class="stat"><div class="n">' + fmtAvg(classAvg()) + '</div><div class="l">O\'rtacha baho</div></div></div>' +
  '<div class="grid">' +
    '<div class="card"><h2>Yaqin darslar</h2>' + (upLessons.length ? upLessons.map(l => '<div class="list-item"><b>' + esc(l.title) + '</b><div class="mut">' + fmtDate(l.date) + '</div></div>').join('') : '<div class="empty">Yaqin darslar yo\'q</div>') + '</div>' +
    '<div class="card"><h2>Yaqin muddatlar</h2>' + (upTasks.length ? upTasks.map(x => '<div class="list-item"><b>' + esc(x.title) + '</b><div class="mut">Muddat: ' + fmtDate(x.deadline) + ' · ' + taskProgress(x) + '% bajarildi</div></div>').join('') : '<div class="empty">Muddatli topshiriqlar yo\'q</div>') + '</div>' +
    '<div class="card"><h2>🏆 Eng faollar</h2>' + (rank.length ? rank.map((r,i) => '<div class="list-item row"><span>' + (i+1) + '. ' + esc(r.n) + '</span><span class="mut">' + r.c + ' topshiriq · ' + (r.a === null ? '—' : r.a + '%') + '</span></div>').join('') : '<div class="empty">Hali o\'quvchi yo\'q</div>') + '</div>' +
  '</div>';
}

// ---------- o'quvchilar
function viewStudents(){
  if (!db.students.length) return '<div class="card">' + HINT + '</div>';
  return '<div class="card"><table><tr><th>#</th><th>Ism</th><th>Yosh</th><th>Telefon</th><th>Davomat</th><th>Uy vazifa</th><th>Topshiriq</th><th></th></tr>' +
    db.students.map((s,i) => {
      const p = attendancePct(s.id);
      return '<tr><td>' + (i+1) + '</td><td>' + esc(s.name) + '</td><td>' + (esc(s.age) || '—') + '</td><td>' + (esc(s.phone) || '—') + '</td>' +
        '<td>' + (p === null ? '—' : '<span class="pill ' + (p >= 80 ? 'g' : p >= 50 ? 'y' : 'r') + '">' + p + '%</span>') + '</td>' +
        '<td>' + (hwPct(s.id) === null ? '—' : hwPct(s.id) + '%') + '</td>' +
        '<td>' + studentTaskCount(s.id) + ' / ' + db.tasks.length + '</td>' +
        '<td style="white-space:nowrap"><button class="btn sec small" onclick="openStudentEdit(\'' + s.id + '\')">Tahrir</button> <button class="btn sec small" onclick="openCard(\'' + s.id + '\')">Kartochka</button> <button class="btn red" onclick="delStudent(\'' + s.id + '\')">O\'chirish</button></td></tr>';
    }).join('') + '</table></div>';
}
function openStudentModal(){
  openModal("Yangi o'quvchi",
    '<div class="field"><label>Ism familiya</label><input type="text" id="mName" placeholder="Masalan: Azizbek Karimov"></div>' +
    '<div class="field"><label>Yosh</label><input type="number" id="mAge" min="5" max="25" placeholder="12"></div>' +
    '<div class="field"><label>Ota-ona telefoni (ixtiyoriy)</label><input type="text" id="mPhone" placeholder="+998 ..."></div>',
    "Qo'shish", () => {
      const name = $('mName').value.trim();
      if (!name){ toast('Ismni kiriting'); return false; }
      db.students.push({ id: uid(), name: name, age: $('mAge').value, phone: $('mPhone').value.trim() });
      save(); render(); toast("O'quvchi qo'shildi");
    });
}
function delStudent(id){
  askConfirm("O'quvchini o'chirasizmi? Uning davomat va topshiriq yozuvlari ham o'chadi.", () => {
    db.students = db.students.filter(s => s.id !== id);
    Object.keys(db.attendance).forEach(d => delete db.attendance[d][id]);
    Object.keys(hwMap()).forEach(d => { if (hwMap()[d].marks) delete hwMap()[d].marks[id]; });
    Object.keys(gradesMap()).forEach(d => delete gradesMap()[d][id]);
    Object.keys(payMap()).forEach(m => delete payMap()[m][id]);
    db.tasks.forEach(t => delete t.done[id]);
    save(); render();
  });
}

// ---------- davomat
let attTmp = {}, attDay = today();
function viewAttendance(){
  const days = Object.keys(db.attendance).filter(d => Object.keys(db.attendance[d]).length).sort().reverse();
  if (!days.length) return '<div class="card">' + HINT + '</div>';
  return '<div class="card"><table><tr><th>Sana</th><th>Keldi</th><th>Kelmadi</th><th>Foiz</th><th>Uy vazifa</th><th></th></tr>' +
    days.map(d => {
      const v = Object.values(db.attendance[d]);
      const p = v.filter(Boolean).length;
      const pct = Math.round(p * 100 / v.length);
      return '<tr><td>' + fmtDate(d) + '</td><td>' + p + '</td><td>' + (v.length - p) + '</td>' +
        '<td><span class="pill ' + (pct >= 80 ? 'g' : pct >= 50 ? 'y' : 'r') + '">' + pct + '%</span></td>' +
        '<td>' + hwCell(d) + '</td>' +
        '<td><button class="btn sec small" onclick="openAttendance(\'' + d + '\')">Tahrirlash</button></td></tr>';
    }).join('') + '</table></div>';
}
function openAttendance(date){
  if (!db.students.length){ toast("Avval o'quvchi qo'shing"); return; }
  attDay = date || today();
  attTmp = Object.assign({}, db.attendance[attDay] || {});
  openModal('Davomat belgilash',
    '<div class="field"><label>Sana</label><input type="date" id="mDate" value="' + attDay + '" onchange="attDateChange(this.value)"></div>' +
    '<button class="btn sec small" style="margin-bottom:8px" onclick="attAll(true)">Hammasi keldi</button>' +
    '<div id="attList"></div>',
    'Saqlash', () => {
      if (Object.keys(attTmp).length) db.attendance[attDay] = attTmp;
      save(); render(); toast('Davomat saqlandi');
    });
  drawAttList();
}
function attDateChange(v){
  if (!v) return;
  attDay = v;
  attTmp = Object.assign({}, db.attendance[attDay] || {});
  drawAttList();
}
function attSet(id, val){ attTmp[id] = val; drawAttList(); }
function attAll(val){ db.students.forEach(s => attTmp[s.id] = val); drawAttList(); }
function drawAttList(){
  $('attList').innerHTML = '<table>' + db.students.map(s =>
    '<tr><td>' + esc(s.name) + '</td><td><div class="att">' +
    '<button class="p ' + (attTmp[s.id] === true ? 'sel' : '') + '" onclick="attSet(\'' + s.id + '\',true)">Keldi</button>' +
    '<button class="a ' + (attTmp[s.id] === false ? 'sel' : '') + '" onclick="attSet(\'' + s.id + '\',false)">Kelmadi</button>' +
    '</div></td></tr>').join('') + '</table>';
}

// ---------- darslar
function viewLessons(){
  if (!db.lessons.length) return '<div class="card">' + HINT + '</div>';
  const list = db.lessons.slice().sort((a,b) => b.date.localeCompare(a.date));
  return '<div class="card">' + list.map(l =>

}

function viewTasks(){
  if (!db.tasks.length) return '<div class="card">' + HINT + '</div>';
  return db.tasks.map(t => {
    const p = taskProgress(t);
    return '<div class="card"><div class="row"><div><b>' + esc(t.title) + '</b><div class="mut">' + (t.deadline ? 'Muddat: ' + fmtDate(t.deadline) : 'Muddatsiz') + (t.desc ? ' · ' + esc(t.desc) : '') + '</div></div>' +

      '<div class="task-students">' + (db.students.map(s => '<label><input type="checkbox" ' + (t.done[s.id] ? 'checked' : '') + ' onchange="toggleTask(\'' + t.id + '\',\'' + s.id + '\',this.checked)"> ' + esc(s.name) + '</label>').join('') || '<span class="mut">O\'quvchilar yo\'q</span>') + '</div></div>';

function toggleTask(tid, sid, val){
  const t = db.tasks.find(x => x.id === tid);
  if (val) t.done[sid] = true; else delete t.done[sid];
  save(); render();
}
function delTask(id){ askConfirm("Topshiriqni o'chirasizmi?", () => { db.tasks = db.tasks.filter(t => t.id !== id); save(); render(); }); }

// ---------- uy vazifasi hisobi
const HW_LABEL = { done: 'Qildi', partial: 'Qisman', no: 'Qilmadi' };
function hwMap(){ db.hw = db.hw || {}; return db.hw; }
function hwPct(sid){
  const days = Object.keys(hwMap()).filter(d => hwMap()[d].marks && sid in hwMap()[d].marks);
  if (!days.length) return null;
  let sum = 0;
  days.forEach(d => { const m = hwMap()[d].marks[sid]; sum += m === 'done' ? 1 : m === 'partial' ? 0.5 : 0; });
  return Math.round(sum * 100 / days.length);
}
function hwCell(d){
  const h = hwMap()[d];
  if (!h || !h.marks || !Object.keys(h.marks).length) return '—';
  const v = Object.values(h.marks);
  const dn = v.filter(x => x === 'done').length;
  return '<span class="mut">№' + (h.lesson + 1) + '</span> ' + dn + ' / ' + v.length;
}

function setCur(i){
  db.cur = Math.min(Math.max(i, 0), DARSLAR.length - 1);
  save(); render();
}
function copyCode(i){
  const text = DARSLAR[i].code;
  const ok = () => toast('Kod nusxalandi');
  const fb = () => {
    const t = document.createElement('textarea');
    t.value = text; document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ toast("Nusxalab bo'lmadi"); }
    document.body.removeChild(t);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb();
}

function aiInsights(){
  if (!db.students.length) return '<div class="mut">Avval o\'quvchilarni qo\'shing, keyin men davomat va uy vazifalarini kuzataman.</div>';
  const out = [];
  out.push(hwMap()[today()] ? "Bugungi so'rov o'tkazilgan ✅" : "Bugun hali so'rov o'tkazilmagan. «So'rovni boshlash» tugmasini bosing.");
  const lowHw = db.students.filter(s => { const p = hwPct(s.id); return p !== null && p < 50; }).map(s => s.name);
  if (lowHw.length) out.push("Uy vazifasini kam bajarayotganlar: " + lowHw.join(', ') + ".");
  const lowAtt = db.students.filter(s => { const p = attendancePct(s.id); return p !== null && p < 60; }).map(s => s.name);
  if (lowAtt.length) out.push("Davomati past: " + lowAtt.join(', ') + ".");
  if (!lowHw.length && !lowAtt.length && Object.keys(hwMap()).length) out.push("Hozircha hamma yaxshi ishlayapti 👍");
  return out.map(x => '<div class="list-item">' + esc(x) + '</div>').join('');
}

// ---------- AI so'rovi (har bir o'quvchidan ketma-ket)
let flow = null;
function openFlow(){
  if (!db.students.length){ toast("Avval o'quvchi qo'shing"); return; }
  flow = { stage: 'start', date: today(), lesson: Math.min(db.cur || 0, DARSLAR.length - 1), i: 0, step: 'came', att: {}, hw: {}, hist: [] };
  modalOk = null;
  drawFlow();
  $('modal').classList.add('show');
}
function closeFlow(){ flow = null; closeModal(); }
function flowStart(){
  flow.date = $('fDate').value || today();
  flow.lesson = +$('fLesson').value;
  flow.stage = 'ask'; flow.i = 0; flow.step = 'came';
  drawFlow();
}
function flowNext(){
  flow.i++; flow.step = 'came';
  if (flow.i >= db.students.length) flow.stage = 'done';
}
function flowAnswer(val){
  flow.hist.push(JSON.stringify({ i: flow.i, step: flow.step, att: flow.att, hw: flow.hw }));
  const s = db.students[flow.i];
  if (flow.step === 'came'){
    flow.att[s.id] = val;
    if (val) flow.step = 'hw'; else flowNext();
  } else {
    flow.hw[s.id] = val;
    flowNext();
  }
  drawFlow();
}
function flowUndo(){
  if (!flow.hist.length) return;
  const h = JSON.parse(flow.hist.pop());
  flow.i = h.i; flow.step = h.step; flow.att = h.att; flow.hw = h.hw; flow.stage = 'ask';
  drawFlow();
}
function flowSave(){
  db.attendance[flow.date] = Object.assign({}, db.attendance[flow.date] || {}, flow.att);
  const old = (hwMap()[flow.date] || {}).marks || {};
  hwMap()[flow.date] = { lesson: flow.lesson, marks: Object.assign({}, old, flow.hw) };
  if ($('fNext') && $('fNext').checked) db.cur = Math.min(flow.lesson + 1, DARSLAR.length - 1);
  const f = flow, sendIt = !!($('fSend') && $('fSend').checked), openMsg = !!($('fOpenMsg') && $('fOpenMsg').checked);
  save(); closeFlow(); render(); toast("So'rov natijalari saqlandi");
  if (sendIt) notifyFlow(f);
  if (openMsg){ msgDate = f.date; tab = 'msg'; render(); window.scrollTo(0, 0); }
}
function drawFlow(){
  const L = DARSLAR[flow.lesson];
  let h = '';
  if (flow.stage === 'start'){
    h = `<h3>🤖 Robo-yordamchi</h3>
    <div class="bub">Salom! Men har bir o'quvchidan ketma-ket so'rayman: <b>darsga keldimi</b> va <b>uy vazifasini qildimi</b>. Natijalar davomat va uy vazifa hisobiga avtomatik yoziladi.</div>
    <div class="field"><label>Sana</label><input type="date" id="fDate" value="${flow.date}"></div>
    <div class="field"><label>Dars</label><select id="fLesson">${DARSLAR.map((d, i) => `<option value="${i}" ${i === flow.lesson ? 'selected' : ''}>${i + 1}. ${esc(d.t)}</option>`).join('')}</select></div>
    <div class="actions"><button class="btn sec" onclick="closeFlow()">Bekor qilish</button><button class="btn" onclick="flowStart()">Boshlash</button></div>`;
  } else if (flow.stage === 'ask'){
    const s = db.students[flow.i];
    const total = db.students.length;
    const chips = db.students.slice(0, flow.i).map(st => {
      const came = flow.att[st.id];
      return `<span class="chip ${came ? 'ok' : 'no'}">${esc(st.name.split(' ')[0])}: ${came ? 'keldi' : 'kelmadi'}${came && flow.hw[st.id] ? ' · ' + HW_LABEL[flow.hw[st.id]] : ''}</span>`;
    }).join('');
    const q = flow.step === 'came'
      ? `<b>${esc(s.name)}</b>, bugun darsga keldingmi?`
      : `<b>${esc(s.name)}</b>, «${esc(L.t)}» darsi bo'yicha uy vazifasini qildingmi?<div class="mut" style="margin-top:6px">Vazifa: ${esc(L.hw)}</div>`;
    const btns = flow.step === 'came'
      ? `<button onclick="flowAnswer(true)">✅ Keldi</button><button onclick="flowAnswer(false)">❌ Kelmadi</button>`
      : `<button onclick="flowAnswer('done')">✅ Qildi</button><button onclick="flowAnswer('partial')">🟡 Qisman</button><button onclick="flowAnswer('no')">❌ Qilmadi</button>`;
    h = `<div class="row"><h3 style="margin:0">🤖 Robo-yordamchi</h3><span class="mut">${flow.i + 1} / ${total}</span></div>
    <div class="bar" style="margin:10px 0"><div style="width:${flow.i * 100 / total}%"></div></div>
    <div class="chips">${chips}</div>
    <div class="bub">${q}</div>
    <div class="ansrow">${btns}</div>
    <div class="actions"><button class="btn sec" onclick="flowUndo()" ${flow.hist.length ? '' : 'disabled'}>↩ Orqaga</button><button class="btn sec" onclick="closeFlow()">To'xtatish</button></div>`;
  } else {
    const came = db.students.filter(s => flow.att[s.id] === true);
    const absent = db.students.filter(s => flow.att[s.id] === false);
    const part = came.filter(s => flow.hw[s.id] === 'partial');
    const no = came.filter(s => flow.hw[s.id] === 'no');
    const done = came.filter(s => flow.hw[s.id] === 'done');
    const names = a => a.length ? a.map(s => esc(s.name)).join(', ') : '—';
    const msg = came.length && done.length / came.length >= 0.7
      ? "Zo'r natija! Ko'pchilik uy vazifasini bajarib kelgan."
      : "Uy vazifasi kam bajarilgan. Keyingi darsdan oldin o'quvchilarga eslatib qo'ying.";
    h = `<h3>🤖 So'rov tugadi</h3>
    <div class="bub">${msg}</div>
    <div class="list-item"><b>Keldi:</b> ${came.length} ta · <b>Kelmadi:</b> ${absent.length} ta<div class="mut">${names(absent)}</div></div>
    <div class="list-item"><b>Vazifani qildi:</b> ${done.length} ta<div class="mut">${names(done)}</div></div>
    <div class="list-item"><b>Qisman:</b> ${part.length} ta<div class="mut">${names(part)}</div></div>
    <div class="list-item"><b>Qilmadi:</b> ${no.length} ta<div class="mut">${names(no)}</div></div>
    ${sendBox()}
    <label class="mut" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="fNext" checked> Saqlagach keyingi darsga o'tish</label>
    <div class="actions"><button class="btn sec" onclick="flowUndo()">↩ Orqaga</button><button class="btn" onclick="flowSave()">Saqlash</button></div>`;
  }
  $('box').innerHTML = h;
}

// ---------- Kundalik: jurnal, jadval, to'lovlar
const OYLAR = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
const KUNLAR = ['Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba','Yakshanba'];
function thisMonth(){ return today().slice(0, 7); }
let jMonth = thisMonth(), pMonth = thisMonth();
function monthLabel(m){ const p = m.split('-'); return OYLAR[+p[1] - 1] + ' ' + p[0]; }
function shiftMonth(m, d){
  const p = m.split('-').map(Number);
  const x = new Date(p[0], p[1] - 1 + d, 1);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0');
}
function money(n){ return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm"; }
function gradesMap(){ db.grades = db.grades || {}; return db.grades; }
function schedList(){ db.schedule = db.schedule || []; return db.schedule; }
function payMap(){ db.pay = db.pay || {}; return db.pay; }
function feeVal(){ return +db.fee || 0; }
function gradeList(sid, month){
  const out = [];
  Object.keys(gradesMap()).sort().forEach(d => {
    if ((!month || d.startsWith(month)) && gradesMap()[d][sid]) out.push({ d: d, g: gradesMap()[d][sid] });
  });
  return out;
}
function avgGrade(sid, month){
  const l = gradeList(sid, month);
  return l.length ? l.reduce((a, x) => a + x.g, 0) / l.length : null;
}
function fmtAvg(v){ return v === null || v === undefined ? '—' : v.toFixed(1); }
function classAvg(){
  const v = db.students.map(s => avgGrade(s.id)).filter(x => x !== null);
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function payOf(m, sid){ return (payMap()[m] || {})[sid] || null; }
function payStatus(m, sid){
  const r = payOf(m, sid);
  if (!r) return 'unpaid';
  return (feeVal() > 0 && r.amount < feeVal()) ? 'partial' : 'paid';
}
const PAY_LABEL = { paid: 'Berilgan', partial: 'Qisman', unpaid: 'Berilmagan' };
const PAY_CLS = { paid: 'g', partial: 'y', unpaid: 'r' };
function monthPaidCount(m){ return db.students.filter(s => payStatus(m, s.id) === 'paid').length; }

function monthBar(m, which){
  return '<div class="row" style="margin-bottom:12px"><button class="btn sec small" onclick="monthGo(\'' + which + '\',-1)">‹</button><b>' + monthLabel(m) + '</b><button class="btn sec small" onclick="monthGo(\'' + which + '\',1)">›</button></div>';
}
function monthGo(which, d){
  if (which === 'j') jMonth = shiftMonth(jMonth, d); else pMonth = shiftMonth(pMonth, d);
  render();
}

// ----- jurnal (baholar)
function viewJournal(){
  if (!db.students.length) return '<div class="card">' + HINT + '</div>';

  const days = Object.keys(set).sort();
  let h = '<div class="card">' + monthBar(jMonth, 'j');
  if (!days.length) return h + '<div class="empty">Bu oyda yozuv yo\'q.<br>O\'ng pastdagi <b style="color:var(--acc)">+</b> orqali baho qo\'ying yoki davomat belgilang.</div></div>';
  h += '<table class="jt"><tr><th>O\'quvchi</th>' + days.map(d => '<th style="cursor:pointer" onclick="openGrade(\'' + d + '\')">' + d.slice(8) + '</th>').join('') + '<th>O\'rt.</th></tr>';
  db.students.forEach(s => {
    h += '<tr><td>' + esc(s.name) + '</td>' + days.map(d => {

let gTmp = {}, gDay = today();

// ----- oylik to'lovlar
function viewPay(){
  const m = pMonth, fee = feeVal(), n = db.students.length;
  let h = '<div class="card">' + monthBar(m, 'p') +
    '<div class="row"><div><div class="mut">Oylik to\'lov (bir o\'quvchi uchun)</div><div style="font-size:20px;font-weight:700">' + (fee ? money(fee) : 'Belgilanmagan') + '</div></div>' +
    '<button class="btn sec small" onclick="openFeeModal()">O\'zgartirish</button></div></div>';
  if (!n) return h + '<div class="card">' + HINT + '</div>';
  let collected = 0, debtors = 0;
  db.students.forEach(s => {
    const r = payOf(m, s.id);
    if (r) collected += +r.amount || 0;
    if (payStatus(m, s.id) !== 'paid') debtors++;
  });
  const expected = fee * n;
  h += '<div class="grid stats" style="margin-bottom:14px">' +
    '<div class="stat"><div class="n" style="font-size:20px">' + money(expected) + '</div><div class="l">Kutilgan</div></div>' +
    '<div class="stat"><div class="n" style="font-size:20px;color:var(--acc)">' + money(collected) + '</div><div class="l">Yig\'ilgan</div></div>' +
    '<div class="stat"><div class="n" style="font-size:20px;color:var(--bad)">' + money(Math.max(0, expected - collected)) + '</div><div class="l">Qarz</div></div>' +
    '<div class="stat"><div class="n">' + debtors + '</div><div class="l">To\'lamaganlar</div></div></div>';
  h += '<div class="card"><table><tr><th>O\'quvchi</th><th>Holat</th><th>Summa</th><th>Sana</th><th></th></tr>' +
    db.students.map(s => {
      const r = payOf(m, s.id), st = payStatus(m, s.id);
      return '<tr><td>' + esc(s.name) + '</td>' +
        '<td><span class="pill ' + PAY_CLS[st] + '" style="cursor:pointer" onclick="quickPay(\'' + s.id + '\')">' + PAY_LABEL[st] + '</span></td>' +
        '<td>' + (r ? money(r.amount) : '—') + '</td><td>' + (r ? fmtDate(r.date) : '—') + '</td>' +
        '<td style="white-space:nowrap"><button class="btn sec small" onclick="openPayEdit(\'' + s.id + '\')">Tahrir</button> <button class="btn sec small" onclick="copyPayMsg(\'' + s.id + '\')">✉️ Xabar</button></td></tr>';
    }).join('') + '</table><div class="mut" style="margin-top:10px">Holat belgisiga bosilsa, to\'liq to\'landi / to\'lanmadi almashadi.</div></div>';
  return h;
}
function openFeeModal(){
  openModal("Oylik to'lov narxi",
    '<div class="field"><label>Bir o\'quvchi uchun oyiga (so\'m)</label><input type="number" id="mFee" min="0" step="1000" value="' + (feeVal() || '') + '" placeholder="200000"></div>',
    'Saqlash', () => {
      db.fee = Math.max(0, +$('mFee').value || 0);
      save(); render(); toast('Narx saqlandi');
    });
}
function quickPay(sid){
  if (!feeVal()){ toast('Avval oylik narxni belgilang'); openFeeModal(); return; }
  const mp = payMap();
  mp[pMonth] = mp[pMonth] || {};
  if (payStatus(pMonth, sid) === 'paid') delete mp[pMonth][sid];
  else { mp[pMonth][sid] = { amount: feeVal(), date: today() }; setTimeout(() => notifyPay(sid, pMonth), 0); }
  save(); render();
}
function openPayEdit(sid){
  const r = payOf(pMonth, sid);
  const s = db.students.find(x => x.id === sid);
  openModal(s.name + ' · ' + monthLabel(pMonth),
    '<div class="field"><label>To\'langan summa (so\'m). Bo\'sh yoki 0 — to\'lanmagan</label><input type="number" id="peAmt" min="0" step="1000" value="' + (r ? r.amount : (feeVal() || '')) + '"></div>' +
    '<div class="field"><label>To\'lov sanasi</label><input type="date" id="peDate" value="' + (r ? r.date : today()) + '"></div>',
    'Saqlash', () => {
      const a = $('peAmt').value;
      const mp = payMap();
      mp[pMonth] = mp[pMonth] || {};
      if (a === '' || +a <= 0) delete mp[pMonth][sid];

}
let pTmp = {}, pMon = thisMonth();
function openPayModal(month){
  if (!db.students.length){ toast("Avval o'quvchi qo'shing"); return; }
  pMon = month || pMonth;
  pTmp = {};
  db.students.forEach(s => { pTmp[s.id] = !!payOf(pMon, s.id); });
  openModal("Oylik to'lov belgilash",
    '<div class="field"><label>Oy</label><input type="month" id="pMonthIn" value="' + pMon + '" onchange="payMonthChange(this.value)"></div>' +
    '<div class="mut" style="margin-bottom:8px">' + (feeVal() ? 'Oylik narx: ' + money(feeVal()) : "Oylik narx belgilanmagan. Avval «To'lovlar» bo'limida narxni kiriting.") + '</div>' +

function payMonthChange(v){

  drawPList();
}
function pSet(id, v){ pTmp[id] = v; drawPList(); }
function drawPList(){
  $('pList').innerHTML = '<table>' + db.students.map(s =>
    '<tr><td>' + esc(s.name) + '</td><td><div class="att">' +

    '<button class="a ' + (!pTmp[s.id] ? 'sel' : '') + '" onclick="pSet(\'' + s.id + '\',false)">To\'lamadi</button>' +
    '</div></td></tr>').join('') + '</table>';
}

// ----- o'quvchi kartochkasi (ota-onalar uchun)
function copyText(text){
  const ok = () => toast('Nusxalandi');
  const fb = () => {
    const t = document.createElement('textarea');
    t.value = text; document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ toast("Nusxalab bo'lmadi"); }
    document.body.removeChild(t);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb();
}
function cardText(sid){
  const s = db.students.find(x => x.id === sid);

// ---------- Ota-onalarga Telegram xabarlari
function tgCfg(){
  db.tg = db.tg || {};
  const c = db.tg;
  if (c.token === undefined) c.token = '';
  if (c.bot === undefined) c.bot = '';
  if (c.offset === undefined) c.offset = 0;
  if (c.auto === undefined) c.auto = true;
  if (c.payMsg === undefined) c.payMsg = true;
  if (!c.log) c.log = [];
  return c;
}
function tgReady(){ return !!(tgCfg().token && tgCfg().bot); }
function ensureCodes(){ db.students.forEach(s => { if (!s.code) s.code = Math.random().toString(36).slice(2, 8); }); }

async function tgCall(method, params){
  const c = tgCfg();
  if (!c.token) throw new Error('Token kiritilmagan');
  const q = new URLSearchParams();
  Object.keys(params || {}).forEach(k => q.set(k, params[k]));
  let r;
  try{ r = await fetch('https://api.telegram.org/bot' + c.token + '/' + method + '?' + q.toString()); }
  catch(e){ throw new Error("Bu oynada internetga chiqish yopiq (Claude ilovasida shunday). Dasturni Chrome'da oching yoki xabarni nusxalab yuboring."); }
  const j = await r.json();
  if (!j.ok) throw new Error(j.description || 'Telegram xatosi');
  return j.result;
}
function tgSend(chatId, text){ return tgCall('sendMessage', { chat_id: chatId, text: text }); }

function logMsg(name, ok, err){
  const c = tgCfg();
  c.log.unshift({ t: Date.now(), n: name, ok: ok, e: err || '' });
  c.log = c.log.slice(0, 20);
  save();
}
async function sendToParents(s, text){
  const chats = s.chats || [];
  if (!chats.length) return 'nolink';
  let ok = 0, err = '';
  for (const id of chats){
    try{ await tgSend(id, text); ok++; }catch(e){ err = e.message; }
  }
  logMsg(s.name, ok > 0, err);
  return ok > 0 ? 'ok' : 'fail';
}

// ota-onalar botga havola orqali kirganda ularni o'quvchiga bog'lash
async function tgSync(){
  const c = tgCfg();
  const me = await tgCall('getMe');
  c.bot = me.username || c.bot;
  const ups = await tgCall('getUpdates', { offset: c.offset || 0, timeout: 0 });
  let bound = 0;
  for (const u of ups){
    c.offset = u.update_id + 1;
    const m = u.message;
    if (!m || !m.text || !m.chat) continue;
    const code = m.text.trim().replace(/^\/start\s*/i, '').trim().toLowerCase();
    const s = db.students.find(x => x.code && x.code.toLowerCase() === code);
    if (s){
      s.chats = s.chats || [];
      if (s.chats.indexOf(m.chat.id) < 0){ s.chats.push(m.chat.id); bound++; }
      try{ await tgSend(m.chat.id, "✅ Ulandi! Endi " + s.name + " haqidagi xabarlar (davomat, uy vazifasi, to'lov) shu yerga keladi."); }catch(e){}
    } else {
      try{ await tgSend(m.chat.id, "Kod topilmadi. Iltimos, o'qituvchidan o'quvchi uchun maxsus havolani so'rang."); }catch(e){}
    }
  }
  save();
  return bound;
}

function payLine(sid){
  const m = thisMonth();
  if (!feeVal()) return '';
  const st = payStatus(m, sid);
  if (st === 'paid') return "\n💰 " + monthLabel(m) + " oyi to'lovi: berilgan ✅";
  const r = payOf(m, sid);
  const left = feeVal() - (r ? r.amount : 0);
  return "\n💰 " + monthLabel(m) + " oyi to'lovi: " + (st === 'partial' ? 'qisman, ' + money(left) + ' qoldi' : 'berilmagan (' + money(left) + ')') + ' ⚠️';
}
async function notifyFlow(f){
  if (!tgReady() || !f) return;
  const L = DARSLAR[f.lesson];
  let ok = 0, fail = 0, nolink = 0;
  for (const s of db.students){
    if (!(s.id in f.att)) continue;
    const came = f.att[s.id];
    let t = came ? '✅ ' + s.name + ' bugun (' + fmtDate(f.date) + ') darsga keldi.' : '⚠️ ' + s.name + ' bugun (' + fmtDate(f.date) + ') darsga kelmadi.';
    if (came){
      const hw = f.hw[s.id];
      t += '\n📚 Dars: ' + L.t;
      t += '\n📝 Uy vazifasi: ' + (hw === 'done' ? 'bajargan ✅' : hw === 'partial' ? 'qisman bajargan 🟡' : hw === 'no' ? 'bajarmagan ❌' : '—');
    }
    t += payLine(s.id) + "\n\n" + CN() + "";
    const r = await sendToParents(s, t);
    if (r === 'ok') ok++; else if (r === 'nolink') nolink++; else fail++;
  }
  if (fail && !ok){ msgDate = f.date; tab = 'msg'; render(); toast("Telegramga ulanib bo'lmadi. Xabarlarni nusxalab yuboring."); return; }
  toast('Xabar: ' + ok + ' ta yuborildi' + (nolink ? ', ' + nolink + ' ta ulanmagan' : '') + (fail ? ', ' + fail + ' ta xato' : ''));
  if (tab === 'msg') render();
}
async function notifyPay(sid, m){
  if (!tgReady() || !tgCfg().payMsg) return;
  const s = db.students.find(x => x.id === sid), r = payOf(m, sid);
  if (!s || !r) return;
  const left = feeVal() - r.amount;
  const t = "💰 " + s.name + ": " + monthLabel(m) + " oyi uchun to'lov qabul qilindi (" + money(r.amount) + ")." + (left > 0 ? " Qolgan: " + money(left) + "." : " Rahmat! ✅") + "\n\n" + CN() + "";
  const res = await sendToParents(s, t);
  if (res === 'ok') toast("Ota-onaga to'lov xabari yuborildi");
}

}

// ---------- Qo'lda yuborish (nusxalab ota-onaga joylash)
let msgDate = today();
function sendDateChange(v){ if (v){ msgDate = v; render(); } }
function buildMsg(s, date){
  const att = (db.attendance[date] || {})[s.id];
  if (att === undefined) return null;
  const kun = date === today() ? 'bugun (' + fmtDate(date) + ')' : fmtDate(date) + ' kuni';
  const h = hwMap()[date];
  let t = att ? '✅ ' + s.name + ' ' + kun + ' darsga keldi.' : '⚠️ ' + s.name + ' ' + kun + ' darsga kelmadi.';
  if (att && h && DARSLAR[h.lesson]) t += '\n📚 Dars: ' + DARSLAR[h.lesson].t;
  if (att && h && h.marks && h.marks[s.id]){
    const m = h.marks[s.id];
    t += '\n📝 Uy vazifasi: ' + (m === 'done' ? 'bajargan ✅' : m === 'partial' ? 'qisman bajargan 🟡' : 'bajarmagan ❌');
  }
  const g = (gradesMap()[date] || {})[s.id];
  if (g) t += '\n⭐ Baho: ' + g;
  return t + payLine(s.id) + "\n\n" + CN() + "";
}
function sendLinks(s, text){
  const enc = encodeURIComponent(text);
  const ph = normPhone(s.phone);
  return (ph ? '<a class="btn sec small" href="https://t.me/' + ph + '" target="_blank" rel="noopener">Chat</a>' : '') +
    '<a class="btn sec small" href="tg://msg?text=' + enc + '">Telegramga</a>' +
    (ph ? '<a class="btn sec small" href="sms:' + ph + '?body=' + enc + '">SMS</a>' : '');
}
function manualSection(){
  let h = '<div class="card"><h2>✉️ Ota-onalarga xabar (nusxalab yuborish)</h2>' +
    '<div class="field"><label>Sana</label><input type="date" value="' + msgDate + '" onchange="sendDateChange(this.value)"></div>';
  if (!db.students.length) return h + '<div class="empty">Avval o\'quvchi qo\'shing.</div></div>';
  const items = db.students.map(s => ({ s: s, t: buildMsg(s, msgDate) })).filter(x => x.t);
  if (!items.length) return h + '<div class="empty">Bu sana uchun davomat belgilanmagan.<br>Avval + tugmasidan «AI so\'rovi» yoki «Davomat belgilash» ni bajaring.</div></div>';
  h += '<div class="mut" style="margin-bottom:8px">Har bir o\'quvchi uchun matn tayyor. «Nusxalash» ni bosib, ota-onaga Telegramda joylang.</div>';

  if (d.length === 9) return '+998' + d;

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: type}));
  a.download = name; a.click();
}
function exportData(){
  const copy = Object.assign({}, db, { tg: Object.assign({}, db.tg || {}, { token: '' }) });

function importData(inp){
  const f = inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if (!d.students) throw 0;
      db = { students: d.students || [], lessons: d.lessons || [], attendance: d.attendance || {}, tasks: d.tasks || [], hw: d.hw || {}, cur: d.cur || 0, grades: d.grades || {}, schedule: d.schedule || [], pay: d.pay || {}, fee: d.fee || 0, tg: Object.assign({}, d.tg || {}, { token: (db.tg || {}).token || '' }) };
      save(); render(); toast('Tiklandi');
    }catch(e){ toast("Fayl noto'g'ri"); }
  };
  r.readAsText(f);
}

  });
  download('davomat.csv', '\uFEFF' + csv, 'text/csv');
}

    {id:'c3', day:4, time:'16:00', title:'Robot loyiha'}
  ];
  db.pay = {};

  save(); render(); toast('Namuna yuklandi');
}

}
function resetAll(){

}
